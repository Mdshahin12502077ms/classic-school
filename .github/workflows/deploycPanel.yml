name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main  # Deploy only when pushing to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        composer install --no-interaction --prefer-dist --optimize-autoloader
        npm install
        npm run prod  # Build assets if you're using Laravel Mix

    - name: Upload via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.1.0
      with:
        server: ${{ secrets.FTP_SERVER }}   # cPanel FTP server address
        username: ${{ secrets.FTP_USERNAME }}  # cPanel FTP username
        password: ${{ secrets.FTP_PASSWORD }}  # cPanel FTP password
    #     local-dir: ./   # Local directory to upload
    #     server-dir: /public_html/  # Directory on the server where the files should be deployed
